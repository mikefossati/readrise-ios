name: ReadRise
options:
  bundleIdPrefix: com.readrise
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  ReadRise:
    type: application
    platform: iOS
    sources:
      - path: ReadRise
        excludes:
          - Resources/Info.plist
          - "**/*.example"
    resources:
      - ReadRise/Resources/Assets.xcassets
    info:
      path: ReadRise/Resources/Info.plist
      properties:
        CFBundleName: ReadRise
        CFBundleDisplayName: ReadRise
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "ReadRise uses the camera to scan book barcodes."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - readrise
            CFBundleURLName: com.readrise.app
        UIBackgroundModes:
          - audio
    entitlements:
      path: ReadRise/Resources/ReadRise.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readrise.app
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Supabase
        product: Supabase

  ReadRiseTests:
    type: bundle.unit-test
    platform: iOS
    sources: ReadRiseTests
    dependencies:
      - target: ReadRise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readrise.app.tests
